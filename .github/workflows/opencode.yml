name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Команда в начале комментария или после пробела: голый contains
    # срабатывал бы на ссылки https://opencode.ai/... в ответах самого агента.
    # Комментарии ботов пропускаем, чтобы агент не запускал сам себя. Звать
    # агента могут только участники: репозиторий публичный, и минуты Actions
    # тратились бы на любой /oc от прохожего. /opus вызывает того же агента
    # на Opus. Комментарий к строке PR из форка не принимаем: checkout берёт
    # код PR, и npm ci выполнил бы его скрипты в job с id-token
    if: |
      (startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opus') ||
       contains(github.event.comment.body, ' /opus')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name != 'pull_request_review_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Вызовы в одном issue или PR идут по очереди: параллельные агенты пушили
    # бы в одну ветку. Ждать может только один прогон, третий вызов вытеснит
    # ожидающий. На уровне job, чтобы очередь не занимали пропущенные прогоны
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Агент, который застрял, не должен шесть часов жечь минуты Actions.
    # Запас на make check с e2e после правки
    timeout-minutes: 45
    # Токену раннера только чтение: пишет агент правами GitHub App, которые
    # получает через OIDC
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Окружение готовится до агента: зависимости и Chromium для make check.
      # Chromium кешируется, без кеша его загрузка доходила до 10 минут. Ключ —
      # версия Playwright, а не весь lock-файл
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: make e2e-install
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          # Action ставит OpenCode 1, а он подключает провайдеров рабочего
          # пространства только после входа в Console через браузер. Поэтому
          # те же провайдеры описаны здесь: запросы идут через шлюз Console с
          # ключом сервисного аккаунта, токены оплачивает подключённый
          # провайдер, а расход попадает в бюджет сервисного аккаунта. Тот же
          # ключ включает и модели opencode/*, оплачиваемые с баланса Console:
          # их не выбирают ни model, ни small_model. Субагент analyst на Opus
          # берёт у основного агента глубокий разбор, правила передачи — в
          # AGENTS.md. Разрешения, которые по умолчанию спрашивают человека,
          # здесь запрещены: в Actions ответить некому, и прогон висел бы до
          # timeout-minutes
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "small_model": "console-anthropic/claude-haiku-5-5",
              "permission": {
                "doom_loop": "deny",
                "external_directory": "deny",
                "read": {
                  "*": "allow",
                  "*.env": "deny",
                  "*.env.*": "deny",
                  "*.env.example": "allow"
                }
              },
              "agent": {
                "analyst": {
                  "mode": "subagent",
                  "model": "console-anthropic/claude-opus-5-5",
                  "description": "Глубокий разбор для основного агента: изменения через несколько слоёв (контракт, бекенд, фронтенд), доменная логика слотов, часовых поясов и пересечений бронирований, правка осознанного решения (ADR в docs/adr, правило в GLOSSARY.md, комментарий в коде со ссылкой на пункт спецификации вида (26.2)), причина неочевидного бага, безопасность и целостность данных. Передай полный текст задачи и обсуждения. Возвращает разбор и план, код не меняет.",
                  "prompt": "Ты делаешь глубокий разбор задачи для основного агента. Опирайся на AGENTS.md, GLOSSARY.md, docs/adr и сам код, проверяй выводы чтением кода и тестами. Верни: суть задачи или причину бага, затронутые файлы и слои, риски и граничные случаи, пошаговый план правки с тестами. Код не меняй.",
                  "permission": { "edit": "deny" }
                }
              },
              "provider": {
                "console-anthropic": {
                  "npm": "@ai-sdk/anthropic",
                  "options": {
                    "baseURL": "https://opencode.ai/inference/custom/conn_01M5SMZ1CFG6C401PF3F0S7A3B",
                    "apiKey": "{env:OPENCODE_API_KEY}"
                  },
                  "models": {
                    "claude-opus-5-5": {},
                    "claude-sonnet-5-5": {},
                    "claude-haiku-5-5": {}
                  }
                }
              }
            }
        with:
          # Ответственную задачу ведёт Opus: тред с меткой critical (у
          # комментария к строке PR метки лежат в pull_request) или вызов
          # командой /opus. Остальное делает Sonnet
          model: >-
            ${{
              (contains(github.event.issue.labels.*.name, 'critical') ||
               contains(github.event.pull_request.labels.*.name, 'critical') ||
               startsWith(github.event.comment.body, '/opus') ||
               contains(github.event.comment.body, ' /opus'))
              && 'console-anthropic/claude-opus-5-5'
              || 'console-anthropic/claude-sonnet-5-5'
            }}
          mentions: /oc,/opencode,/opus
          # В публичном репозитории action по умолчанию публикует сессию по
          # ссылке со всем, что агент прочитал и вывел. Итог агент и так пишет
          # в тред, а лог прогона открыт
          share: false
