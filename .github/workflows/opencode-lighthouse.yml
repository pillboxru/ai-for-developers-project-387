name: opencode-lighthouse

on:
  # Cron считается в UTC: 03:00 UTC — это 06:00 по Москве, к утру отчёт готов
  schedule:
    - cron: '0 3 * * *'
  # Без ручного запуска правку воркфлоу можно проверить, только дождавшись ночи
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ручной запуск рядом с ночным увидел бы, что открытого issue нет, и оба
    # прогона создали бы по issue
    concurrency:
      group: opencode-lighthouse
      cancel-in-progress: false
    # Агент работает правами GitHub App, полученными через OIDC, а issue
    # публикует шаг воркфлоу с токеном раннера, поэтому токену нужен
    # issues: write. contents и pull-requests: write этому воркфлоу не нужны:
    # PR action открывает правами App. Их требует задание урока, поэтому
    # токен раннера агенту не передаётся
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      # Адрес держим переменной репозитория, а не в воркфлоу: при переезде
      # приложения меняется только она
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Отчёт лежит в рабочей копии, чтобы агент мог его прочитать. Из git его
      # исключаем: иначе action увидит изменения и откроет с ними PR
      - run: |
          mkdir lighthouse
          echo 'lighthouse/' >> .git/info/exclude
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Бесплатный сервис Render засыпает, и первый запрос после простоя идёт
      # до минуты. Без прогрева Lighthouse замерил бы холодный старт сервера,
      # а не скорость страницы. Повторы укладываются в семь минут, остальное
      # время job — Lighthouse и агенту
      - name: Wake up the app
        run: |
          : "${APP_URL:?Не задана переменная репозитория APP_URL}"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 -o /dev/null "$APP_URL"
      - name: Run Lighthouse
        run: >-
          npx --yes lighthouse@13.5.0 "$APP_URL"
          --quiet
          --output=json --output=html
          --output-path=lighthouse/report
          --chrome-flags="--headless=new --no-sandbox"
      # Полный JSON весит сотни килобайт служебных полей, на нём Haiku теряет
      # главное. Агенту отдаём выжимку в несколько килобайт: оценки, метрики и
      # проверки с оценкой ниже 0.9. Полный отчёт остаётся в артефакте
      - name: Summarize the report
        run: |
          jq '
            . as $report
            | {
                url: .finalDisplayedUrl,
                fetchTime,
                lighthouseVersion,
                formFactor: .configSettings.formFactor,
                runWarnings,
                categories: (.categories | map_values(if .score == null then null else .score * 100 | round end)),
                metrics: (
                  ["first-contentful-paint", "largest-contentful-paint", "total-blocking-time", "cumulative-layout-shift", "speed-index"]
                  | map({ key: ., value: $report.audits[.].displayValue })
                  | from_entries
                ),
                failed: (
                  [ .categories[] as $category
                    | $category.auditRefs[]
                    | $report.audits[.id]
                    | select(.score != null and .score < 0.9)
                    | { id, category: $category.id, title, score, displayValue, savings: .metricSavings }
                  ]
                  | group_by(.id)
                  | map(.[0] + { categories: map(.category) } | del(.category))
                  | sort_by(.score)
                )
              }
          ' lighthouse/report.report.json > lighthouse/summary.json
          cat lighthouse/summary.json
      - uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: |
            lighthouse/report.report.html
            lighthouse/report.report.json
            lighthouse/summary.json
      # Метку issue с итогами создаём заранее: gh issue create с меткой,
      # которой нет, падает. --force делает шаг повторяемым
      - run: gh label create lighthouse --color FBCA04 --description 'Ночная проверка Lighthouse' --force
        env:
          GH_TOKEN: ${{ github.token }}
      # Прошлые итоги для сравнения агент получает файлом, а не читает issue
      # сам: в комментариях публичного issue пишет кто угодно, а здесь берём
      # только тексты, которые опубликовал этот воркфлоу
      - name: Find the previous report
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=lighthouse&state=open" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and .pull_request == null)][0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            comment=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .id' | tail -n 1)
            if [ -n "$comment" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment" --jq .body > lighthouse/previous.md
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq .body > lighthouse/previous.md
            fi
          fi
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          # Провайдер тот же, что в opencode.yml. Разбор выжимки — простая
          # задача, ей хватает Haiku. Агент только пишет lighthouse/issue.md:
          # bash и webfetch запрещены, токена раннера у него нет. Шаблоны
          # для gh не спасали: под --title * подходит и "$OPENCODE_API_KEY",
          # который раскроет shell, а заголовок issue публичный. Субагенты не
          # вызываются, разрешения, которые спрашивают человека, запрещены.
          # Чтение .git запрещено: action кладёт токен GitHub App в
          # .git/config (extraheader), и агент мог бы переписать его в
          # issue.md. grep и glob пропускают .git сами
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "small_model": "console-anthropic/claude-haiku-5-5",
              "permission": {
                "edit": {
                  "*": "deny",
                  "*lighthouse/issue.md": "allow"
                },
                "bash": "deny",
                "webfetch": "deny",
                "task": "deny",
                "doom_loop": "deny",
                "external_directory": "deny",
                "read": {
                  "*": "allow",
                  "*.env": "deny",
                  "*.env.*": "deny",
                  "*.env.example": "allow",
                  ".git/*": "deny",
                  "*/.git/*": "deny"
                }
              },
              "provider": {
                "console-anthropic": {
                  "npm": "@ai-sdk/anthropic",
                  "options": {
                    "baseURL": "https://opencode.ai/inference/custom/conn_01M5SMZ1CFG6C401PF3F0S7A3B",
                    "apiKey": "{env:OPENCODE_API_KEY}"
                  },
                  "models": { "claude-haiku-5-5": {} }
                }
              }
            }
        with:
          model: console-anthropic/claude-haiku-5-5
          # Ответить агенту некуда: треда нет, а лог прогона к утру никто не
          # читает. Поэтому итог — issue с меткой lighthouse
          prompt: |
            Разбери ночную проверку Lighthouse опубликованного приложения и
            создай issue с итогами: запиши его текст в lighthouse/issue.md,
            а опубликует его шаг воркфлоу после тебя. Код не меняй, другие
            файлы не пиши, субагентов не вызывай. Команды shell и gh тебе
            недоступны, они не нужны.

            Выжимка отчёта — lighthouse/summary.json: оценки категорий от 0
            до 100, метрики и проверки с оценкой ниже 0.9 (score от 0 до 1,
            savings — ожидаемая экономия в мс). Полный отчёт —
            lighthouse/report.report.json, открывай его, только если
            выжимки не хватает. Отчёт со всеми файлами сохранён артефактом
            lighthouse-report прогона
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Если runWarnings в выжимке не пуст, сначала опиши предупреждения:
            это сбой проверки, а не приложения.

            По каждой находке напиши по-русски, коротко:
            - что не так и насколько: оценка, displayValue, savings;
            - где искать причину в репозитории (frontend/, backend/src/app.ts,
              Dockerfile) и что поправить. Не уверен в причине — так и
              напиши, не выдумывай;
            - сначала находки с наибольшей экономией и влиянием на оценку
              performance.
            Цифры бери только из отчёта.

            В lighthouse/issue.md в начале — оценки категорий и метрики, в
            конце — ссылка на прогон выше. Заголовок не пиши, его задаёт
            воркфлоу.

            Если есть lighthouse/previous.md, это итоги прошлого прогона:
            воркфлоу добавит твой текст комментарием к тому же issue.
            Сравни с ними и напиши, что улучшилось, что ухудшилось и какие
            находки появились или ушли. Файла нет — это первый отчёт.
      # Публикует шаг, а не агент: токен раннера остаётся вне его досягаемости.
      # Issue от токена раннера не запускает opencode-triage, и ночной отчёт
      # не уходит на оценку. Пустой файл — сбой агента, прогон падает.
      # Issue публичное, поэтому перед публикацией ищем ключ Console и следы
      # токенов GitHub: префиксы токенов, x-access-token и его base64 из
      # extraheader в .git/config. Это вторая линия после запретов агенту:
      # их поведение зависит от версии action, а она @latest. Найденное в
      # лог не печатаем
      - name: Publish the report
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.previous.outputs.number }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ ! -s lighthouse/issue.md ]; then
            echo '::error::Агент не подготовил lighthouse/issue.md'
            exit 1
          fi
          # С пустым ключом grep -F совпал бы с любой строкой
          : "${OPENCODE_API_KEY:?Не задан секрет OPENCODE_API_KEY}"
          # grep возвращает 0, если нашёл, 1, если нет, и 2 при ошибке.
          # Публикуем только при 1: ошибка проверки не должна пропускать отчёт
          status=0
          grep -qF -e "$OPENCODE_API_KEY" lighthouse/issue.md || status=$?
          if [ "$status" -eq 1 ]; then
            status=0
            grep -qiE 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|x-access-token|eC1hY2Nlc3MtdG9rZW46|extraheader|authorization:' lighthouse/issue.md || status=$?
          fi
          if [ "$status" -ne 1 ]; then
            echo '::error::В lighthouse/issue.md похоже на секрет или проверка не удалась, отчёт не опубликован'
            exit 1
          fi
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file lighthouse/issue.md
          else
            gh issue create --label lighthouse --title 'Lighthouse: скорость и качество страницы' --body-file lighthouse/issue.md
          fi
