emit:
  - '@typespec/openapi3'
warn-as-error: true
options:
  '@typespec/openapi3':
    emitter-output-dir: '{project-root}/dist'
    output-file: openapi.json
    file-type: json
    # 3.1 ломает Ajv в Fastify: null превращается в "" (ADR 0005)
    openapi-versions: [3.0.0]
    # Лишнее поле в теле, в том числе id (ADR 0003), должно давать 400
    seal-object-schemas: true
